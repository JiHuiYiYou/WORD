<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5918/5918309.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORD v2 — 单词背默系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 背景光效 -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 顶部导航栏：整条可点击返回主页 -->
    <nav id="appNav" onclick="WORD.goHome()">
        <div class="nav-brand">
            <div class="nav-logo">
                <i class="fas fa-book-open" style="color:#000;font-size:14px;"></i>
            </div>
            <span class="font-serif nav-word">WORD</span>
        </div>
        <div id="sectionTitle" class="nav-title">
            <span class="font-serif nav-title-text">主页</span>
            <span class="font-serif nav-home-hint">返回主页</span>
        </div>
    </nav>

    <!-- ======== 侧边栏遮罩（全局共享，三个板块通用） ======== -->
    <div class="overlay" id="sidebarOverlay" onclick="WORD.Reinforce.toggleSidebar()"></div>

    <!-- ======== 侧边栏三角标签（全局共享） ======== -->
    <div class="sidebar-tab" id="sidebarTab" style="display:none;" onclick="WORD.Reinforce.toggleSidebar()" title="收起/展开侧边栏">
        <i class="fas fa-chevron-left" id="sidebarTabIcon"></i>
    </div>


    <!-- ======== 侧边栏（全局共享：背记/加强/检测通用） ======== -->
    <aside class="sidebar" id="sidebar" style="display:none;">
        <div style="padding:24px;">
            <!-- Logo -->
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
                <div style="width:40px;height:40px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-book-open" style="color:#000;font-size:18px;"></i>
                </div>
                <div>
                    <div class="font-serif" style="font-size:22px;font-weight:900;color:var(--fg);line-height:1;">WORD</div>
                    <div style="font-size:11px;color:var(--muted);letter-spacing:1px;">单词背默系统 v2</div>
                </div>
            </div>
            <!-- 系统设置 -->
            <div style="margin-bottom:28px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                    <i class="fas fa-gear" style="color:var(--accent);font-size:13px;"></i>
                    <span style="font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:0.5px;">系统设置</span>
                </div>
                <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:6px;">达标需正确次数</label>
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="btn btn-secondary btn-sm" onclick="WORD.Reinforce.adjustTarget(-1)" style="width:36px;padding:0;height:36px;">
                        <i class="fas fa-minus" style="font-size:10px;"></i>
                    </button>
                    <input type="number" id="targetCorrect" class="input-field" value="2" min="1" max="10"
                        style="text-align:center;width:60px;padding:8px;font-weight:700;font-size:18px;">
                    <button class="btn btn-secondary btn-sm" onclick="WORD.Reinforce.adjustTarget(1)" style="width:36px;padding:0;height:36px;">
                        <i class="fas fa-plus" style="font-size:10px;"></i>
                    </button>
                </div>
            </div>
            <!-- 输入单词 -->
            <div style="margin-bottom:28px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                    <i class="fas fa-download" style="color:var(--accent2);font-size:13px;"></i>
                    <span style="font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:0.5px;">设置单词</span>
                </div>
                <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:6px;">请输入单词/短语（每行1个）</label>
                <textarea id="wordInput" class="input-field"
                    placeholder="示例：&#10;apple 苹果&#10;look forward to 期待&#10;COVID-19 新冠肺炎" rows="6"></textarea>
                <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="WORD.Reinforce.setWordList()">
                    <i class="fas fa-list-check"></i> 设置单词列表
                </button>
            </div>
            <!-- LLM 智能提取 -->
            <div style="margin-bottom:28px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;user-select:none;" onclick="WORD.Reinforce._toggleLLMSection()" id="llmSectionHeader">
                    <i class="fas fa-robot" style="color:#a78bfa;font-size:13px;"></i>
                    <span style="font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:0.5px;">LLM 智能提取</span>
                    <i class="fas fa-chevron-down" id="llmSectionIcon" style="margin-left:auto;font-size:11px;color:var(--muted);transition:transform 0.25s;"></i>
                </div>
                <div id="llmSectionBody">
                    <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:6px;">粘贴任意格式的单词文本（Markdown 表格、emoji 列表等均可）</label>
                    <textarea id="llmExtractInput" class="input-field"
                        placeholder="粘贴 LLM 整理的难词表、笔记等任意格式文本，AI 自动识别并提取 英文 ↔ 中文 配对..." rows="6"></textarea>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <button class="btn btn-secondary" style="flex:1;" onclick="WORD.Reinforce._pasteFromClipboard()">
                            <i class="fas fa-clipboard"></i> 粘贴
                        </button>
                        <button class="btn btn-primary" style="flex:1;" id="llmExtractBtn" onclick="WORD.Reinforce.extractWordsFromLLM()">
                            <i class="fas fa-wand-magic-sparkles"></i> 提取
                        </button>
                    </div>
                    <div id="llmExtractStatus" style="font-size:12px;color:var(--muted);margin-top:8px;display:none;"></div>
                </div>
            </div>
            <!-- 编辑标准答案 -->
            <div id="editSection" style="display:none;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                    <i class="fas fa-pen-to-square" style="color:var(--accent);font-size:13px;"></i>
                    <span style="font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:0.5px;">编辑标准答案</span>
                </div>
                <div id="editEntries"></div>
                <button class="btn btn-gold" style="width:100%;margin-top:14px;" onclick="WORD.saveAndStart()">
                    <i class="fas fa-floppy-disk"></i> 保存并开始
                </button>
            </div>
            <!-- 快捷操作 -->
            <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border);">
                <button class="btn btn-danger btn-sm" style="width:100%;" onclick="WORD.Reinforce.resetAll()">
                    <i class="fas fa-rotate-left"></i> 重置所有数据
                </button>
            </div>
        </div>
        <!-- 滚动到底部按钮 -->
        <button class="sidebar-scroll-btn" id="sidebarScrollBtn" onclick="WORD.scrollSidebarToBottom()" title="滚动到底部">
            <i class="fas fa-chevron-down"></i>
        </button>
    </aside>

    <!-- ======== 加强板块 ======== -->
    <section id="section-reinforce" class="app-section" style="display:none;">

    <!-- ======== 加强主内容 ======== -->
    <main class="main-content" id="mainContent" style="display:none;">
        <div style="max-width:700px;margin:0 auto;padding:32px 20px 80px;">
            <div id="headerStats" style="display:none;gap:16px;align-items:center;justify-content:center;margin-bottom:20px;">
                    <div style="text-align:right;">
                        <div style="font-size:24px;font-weight:700;color:var(--accent);" id="headerMastered">0</div>
                        <div style="font-size:11px;color:var(--muted);">已达标</div>
                    </div>
                    <div style="width:1px;height:32px;background:var(--border);"></div>
                    <div style="text-align:right;">
                        <div style="font-size:24px;font-weight:700;color:var(--accent2);" id="headerTotal">0</div>
                        <div style="font-size:11px;color:var(--muted);">总单词</div>
                    </div>
                </div>

            <!-- 空状态 -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon"><i class="fas fa-spell-check"></i></div>
                <h2 class="font-serif" style="font-size:24px;font-weight:700;margin-bottom:8px;color:var(--fg);">开始你的背默之旅</h2>
                <p style="color:var(--muted);font-size:15px;max-width:400px;line-height:1.6;">
                    在左侧边栏输入单词列表，设置标准答案后即可开始练习。
                </p>
                <button class="btn btn-primary" style="margin-top:24px;" onclick="WORD.Reinforce.toggleSidebar(true)">
                    <i class="fas fa-plus"></i> 添加单词
                </button>
            </div>

            <!-- 练习区域 -->
            <div id="practiceArea" style="display:none;">
                <!-- 进度 -->
                <div style="display:flex;align-items:center;gap:24px;margin-bottom:28px;">
                    <div style="position:relative;width:80px;height:80px;flex-shrink:0;">
                        <svg class="progress-ring" width="80" height="80" viewBox="0 0 80 80">
                            <circle class="progress-ring-bg" cx="40" cy="40" r="34" />
                            <circle class="progress-ring-fill" id="progressRing" cx="40" cy="40" r="34"
                                stroke-dasharray="213.63" stroke-dashoffset="213.63" />
                        </svg>
                        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
                            <span id="progressText" style="font-size:16px;font-weight:700;color:var(--accent);">0%</span>
                        </div>
                    </div>
                    <div style="flex:1;">
                        <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">当前进度</div>
                        <div style="font-size:20px;font-weight:700;" id="progressDetail">0 / 0</div>
                        <div style="margin-top:8px;height:4px;border-radius:4px;background:var(--border);overflow:hidden;">
                            <div id="progressBar" style="height:100%;border-radius:4px;background:var(--accent);transition:width 0.5s ease;width:0%;"></div>
                        </div>
                    </div>
                </div>

                <!-- 方向选择 -->
                <div style="display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;">
                    <button class="dir-btn active" id="dirC2E" onclick="WORD.Reinforce.setDirection('中译英')">
                        <i class="fas fa-language" style="margin-right:4px;"></i> 中译英
                    </button>
                    <button class="dir-btn" id="dirE2C" onclick="WORD.Reinforce.setDirection('英译中')">
                        <i class="fas fa-font" style="margin-right:4px;"></i> 英译中
                    </button>
                    <button class="dir-btn" id="dirListenMeaning" onclick="WORD.Reinforce.setDirection('听音写义')">
                        <i class="fas fa-ear-listen" style="margin-right:4px;"></i> 听音写义
                    </button>
                    <button class="dir-btn" id="dirListenSpell" onclick="WORD.Reinforce.setDirection('听音写英')">
                        <i class="fas fa-headphones" style="margin-right:4px;"></i> 听音写英
                    </button>
                    <button class="dir-btn" id="dirListenBoth" onclick="WORD.Reinforce.setDirection('听音写英加义')">
                        <i class="fas fa-file-pen" style="margin-right:4px;"></i> 听音写英加义
                    </button>
                </div>

                <!-- 练习卡片 -->
                <div class="practice-card" id="practiceCard">
                    <!-- 文字提示 -->
                    <div style="text-align:center;margin-bottom:32px;" id="textPrompt">
                        <div style="font-size:13px;color:var(--muted);margin-bottom:12px;" id="promptLabel">请写出以下内容的英文</div>
                        <div class="font-serif" style="font-size:36px;font-weight:900;line-height:1.3;" id="promptWord">—</div>
                    </div>
                    <!-- 音频提示 -->
                    <div style="text-align:center;margin-bottom:24px;display:none;" id="audioPrompt">
                        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;" id="promptLabelAudio">请听音频，写出对应的中文意思</div>
                        <button class="audio-play-btn" id="audioPlayBtn" onclick="WORD.TTS.replay()" title="点击播放/重播">
                            <i class="fas fa-play play-icon" id="audioPlayIcon"></i>
                        </button>
                        <div class="audio-wave" id="audioWave" style="display:none;margin-top:12px;">
                            <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
                            <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
                            <div class="audio-wave-bar"></div>
                        </div>
                        <p style="font-size:12px;color:var(--muted);margin-top:10px;" id="audioHint">点击按钮播放 / 重播音频</p>
                    </div>
                    <!-- 答案输入 -->
                    <div style="max-width:480px;margin:0 auto 28px;">
                        <input type="text" class="answer-input" id="answerInput" placeholder="输入你的答案..."
                            autocomplete="off" onkeydown="WORD.Reinforce.handleAnswerKey(event)">
                        <input type="text" class="answer-input" id="answerInputCh" placeholder="输入中文意思..."
                            autocomplete="off" style="display:none;margin-top:10px;"
                            onkeydown="WORD.Reinforce.handleAnswerKey(event)">
                    </div>
                    <!-- 操作按钮 -->
                    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                        <button class="btn btn-primary" id="submitBtn" onclick="WORD.Reinforce.submitAnswer()" style="min-width:160px;">
                            <i class="fas fa-check"></i> 提交答案
                        </button>
                        <button class="btn btn-secondary" id="skipBtn" onclick="WORD.Reinforce.skipWord()">
                            <i class="fas fa-forward"></i> 跳过
                        </button>
                    </div>
                    <!-- 反馈区 -->
                    <div id="feedbackArea" style="display:none;margin-top:28px;padding-top:24px;border-top:1px solid var(--border);text-align:center;">
                        <div id="feedbackIcon" style="font-size:48px;margin-bottom:12px;"></div>
                        <div id="feedbackText" style="font-size:16px;font-weight:600;margin-bottom:8px;"></div>
                        <div id="feedbackAnswer" style="font-size:14px;color:var(--muted);"></div>
                        <button class="btn btn-primary" style="margin-top:20px;" onclick="WORD.Reinforce.nextWord()">
                            <i class="fas fa-arrow-right"></i> 下一个单词
                        </button>
                    </div>
                </div>

                <!-- 统计 -->
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px;">
                    <div class="stat-card">
                        <div class="stat-value" style="color:var(--fg);" id="statTotal">0</div>
                        <div class="stat-label">总单词数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color:var(--success);" id="statMastered">0</div>
                        <div class="stat-label">已达标</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color:var(--accent2);" id="statUnmastered">0</div>
                        <div class="stat-label">未达标</div>
                    </div>
                </div>

                <!-- 单词列表 -->
                <div style="margin-top:32px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                        <h3 style="font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;">
                            <i class="fas fa-list" style="color:var(--accent);font-size:14px;"></i> 单词列表
                        </h3>
                        <button class="btn btn-secondary btn-sm" onclick="WORD.Reinforce.toggleWordList()" id="toggleListBtn">
                            <i class="fas fa-chevron-down" id="toggleListIcon"></i> 展开
                        </button>
                    </div>
                    <div id="wordListContainer" style="display:none;">
                        <div class="card" style="padding:0;overflow:hidden;">
                            <table class="word-table">
                                <thead>
                                    <tr>
                                        <th style="width:40px;">#</th>
                                        <th>英文</th>
                                        <th>中文</th>
                                        <th style="width:80px;">正确次数</th>
                                        <th style="width:50px;">错误</th>
                                        <th style="width:80px;">状态</th>
                                    </tr>
                                </thead>
                                <tbody id="wordTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 通关庆祝 -->
            <div id="celebrationOverlay" style="display:none;" class="mastery-celebration">
                <div class="mastery-content" style="text-align:center;">
                    <div style="font-size:80px;margin-bottom:20px;">🎓</div>
                    <h2 class="font-serif" style="font-size:36px;font-weight:900;color:var(--accent);margin-bottom:12px;">恭喜通关</h2>
                    <p style="font-size:18px;color:var(--fg2);margin-bottom:32px;">所有单词均已掌握，太棒了！</p>
                    <button class="btn btn-gold" style="font-size:16px;padding:14px 32px;" onclick="WORD.navigateTo('test', {words: WORD.state.reinforce.wordsDf, start: true, direction: WORD.state.reinforce.direction})">
                        <i class="fas fa-clipboard-check"></i> 进入检测
                    </button>
                    <button class="btn btn-secondary" style="font-size:14px;padding:12px 28px;margin-left:12px;" onclick="WORD.Reinforce.restartPractice()">
                        <i class="fas fa-rotate"></i> 重新开始
                    </button>
                </div>
            </div>
        </div>
    </main>
    </section>

    <!-- ================================================================
         SECTION: HOME (主页)
         ================================================================ -->
    <section id="section-home" class="app-section">
        <div style="max-width:900px;margin:0 auto;padding:40px 20px 80px;">
            <div class="home-hero">
                <h1 class="font-serif"><span style="color:var(--accent);">W</span>ORD</h1>
                <p>沉浸式单词背默系统 — 背记 · 加强 · 检测，一条龙掌握单词</p>
            </div>
        </div>
    </section>

    <!-- ================================================================
         SECTION: MEMORIZATION (背记)
         ================================================================ -->
    <section id="section-memorize" class="app-section" style="display:none;"></section>

    <!-- ================================================================
         SECTION: TESTING (检测)
         ================================================================ -->
    <section id="section-test" class="app-section" style="display:none;"></section>

    <!-- ================================================================
         SCRIPTS (load order matters!)
         ================================================================ -->
    <script src="js/word-global.js"></script>
    <script src="js/word-storage.js"></script>
    <script src="js/word-utils.js"></script>
    <script src="js/word-tts.js"></script>
    <script src="js/word-llm.js"></script>
    <script src="js/word-ui.js"></script>
    <script src="js/word-home.js"></script>
    <script src="js/word-memorization.js"></script>
    <script src="js/word-reinforcement.js"></script>
    <script src="js/word-testing.js"></script>
    <script src="js/word-app.js"></script>
</body>

</html>
